version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /apps/ai-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
